replicaCount: 2

nameOverride: ""
fullnameOverride: user-service

image:
  repository: pinstack/user-service
  tag: "dev"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: false
  name: ""

service:
  type: ClusterIP
  port: 50051

env:
  ENV: dev

db:
  host: user-db
  port: "5432"
  name: userservice
  user: postgres
  passwordSecret:
    name: user-db-secret
    key: password

migrator:
  enabled: true
  image:
    repository: pinstack/user-migrator
    tag: "dev"
    pullPolicy: IfNotPresent
  command:
    - ./migrator
    - -command
    - up
  backoffLimit: 3
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 300

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

resources: {}

livenessProbe:
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []

affinity: {}
