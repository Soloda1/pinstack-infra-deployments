replicaCount: 2

nameOverride: ""
fullnameOverride: relation-service

image:
  repository: pinstack/relation-service
  tag: "dev"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: false
  name: ""

service:
  type: ClusterIP
  port: 50054

env:
  ENV: dev

db:
  host: relation-db
  port: "5432"
  name: relationservice
  user: postgres
  passwordSecret:
    name: relation-db-secret
    key: password

migrator:
  enabled: true
  image:
    repository: pinstack/relation-migrator
    tag: "dev"
    pullPolicy: IfNotPresent
  command:
    - ./migrator
    - -command
    - up
  backoffLimit: 3
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 300

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

resources: {}

livenessProbe:
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []

affinity: {}
